apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend
  namespace: bench-workload
  labels:
    app: dummy-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-backend
  template:
    metadata:
      labels:
        app: dummy-backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
